# Mosquitto 2.x for the homelab stack: plain MQTT on 1883, anonymous.
#
# docker-compose.yml publishes 1883 on 127.0.0.1 only (MQTT_BIND). Real ESP32
# sensors need it on the LAN; before you set MQTT_BIND to the Pi's address,
# switch to the TLS + password + ACL setup from iot-sensor-panel
# (docs/security-demo.md there). Anyone on the LAN can read and publish here.

per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
