name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install sibling projects from GitHub, then this project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/siblings-git.txt
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Validate router rules with mini-siem
        run: siem check-rules siem/rules

      - name: Pytest
        run: pytest -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway .env
        run: python3 scripts/init_env.py

      - name: docker compose config
        run: |
          docker compose version
          docker compose config --quiet
          docker compose --profile simulator config --quiet

      - name: Every published port is on loopback by default
        run: |
          docker compose --profile simulator config --format json \
            | python3 -c 'import json,sys; c=json.load(sys.stdin); bad=[(n,p) for n,s in c["services"].items() for p in s.get("ports",[]) if p.get("host_ip")!="127.0.0.1"]; print(bad); sys.exit(1 if bad else 0)'
