[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "homelab-security-panel"
version = "0.1.0"
description = "Home network security panel: device inventory, scheduled port scans, router syslog and one Grafana for a small homelab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Emre Özaydın" }]
keywords = ["homelab", "security", "network", "arp", "syslog", "grafana", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
# async-vuln-scanner is not on PyPI. Install it first, from GitHub or from a
# local checkout, with one of the files in requirements/ (see README).
dependencies = [
    "async-vuln-scanner>=0.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Raw-socket ARP discovery through the scanner's Scapy integration.
arp = ["scapy>=2.5"]
# mini-siem is only needed by the test-suite (its storage code creates the test DB
# and its rule loader validates siem/rules/router.yml). Install it like the scanner.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
homesec = "homesec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homesec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["homesec"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# Verbatim log lines and tool output are easier to read unwrapped.
"tests/**" = ["E501"]
